{% load static %}
<!DOCTYPE html>
<html lang="en" data-layout="modern" data-theme="default" data-bs-theme="light" data-sidebar-colors="dark"
    data-sidebar="large" data-topbar-colors="light" data-nav-type="default" dir="ltr" data-colors="default"
    data-profile-sidebar>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Sign In | Atmayana Admin</title>

    <!-- Favicon -->
    <link rel="shortcut icon" href="{% static 'assets/images/favicon.ico' %}">

    <!-- RTL CSS (disabled) -->
    <link href="{% static 'assets/css/bootstrap.rtl.css' %}" rel="stylesheet" type="text/css" disabled>
    <link href="{% static 'assets/css/app.rtl.css' %}" rel="stylesheet" type="text/css" disabled>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com/">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">

    <!-- JS Bundles -->
    <script type="module" crossorigin src="{% static 'assets/admin.bundle-BD84ghkN.js' %}"></script>
    <!-- <script type="module" crossorigin src="{% static 'assets/signin-basic.init-CarhJS1N.js' %}"></script> -->

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'assets/css/bootstrap.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/icons.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/app.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/admin.css' %}">
</head>

<body class="sidebar-hidden">
    <div class="body-effect-img"></div>

    <div class="auth-wrapper">
        <div class="container min-vh-100 py-10 d-flex align-items-center">
            <div class="w-100">
                <div class="row justify-content-center">
                    <div class="col-12 col-md-10 col-lg-7 col-xl-6 col-xxl-4">
                        <div class="card mb-0">
                            <div class="p-sm-8 p-md-10 card-body">

                                <h4 class="mb-2 text-gradient text-center">Sign In</h4>

                                <form method="POST" action="{% url 'backoffice' %}">
                                    {% csrf_token %}

                                    {% if messages %}
                                        {% for message in messages %}
                                        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible" role="alert">
                                            <span>{{ message }}</span>
                                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                        </div>
                                        {% endfor %}
                                    {% endif %}

                                    <div class="row g-4 mt-3">

                                        <div class="col-12 mt-0">
                                            <label for="emailInput" class="form-label">Username</label>
                                            <input type="text" id="emailInput" name="username"
                                                placeholder="Enter your username" class="form-control" required>
                                        </div>

                                        <div class="col-12">
                                            <label for="passwordInput" class="form-label">Password</label>
                                            <div class="position-relative">
                                                <input type="password" id="passwordInput" name="password"
                                                    class="form-control pe-8" placeholder="Enter your password" required>
                                                <div class="position-absolute top-50 end-0 me-3 translate-middle-y text-muted cursor-pointer"
                                                    id="passwordShowIcon">
                                                    <i data-lucide="eye-off" class="size-5"></i>
                                                    <i data-lucide="eye" class="size-5 d-none"></i>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="col-12 d-flex justify-content-between align-items-center">
                                            <div class="form-check check-primary">
                                                <input type="checkbox" id="rememberMe" class="form-check-input">
                                                <label for="rememberMe" class="form-check-label">Remember me</label>
                                            </div>
                                        </div>

                                        <div class="col-12">
                                            <button type="submit" class="btn btn-primary w-100">Sign In</button>
                                        </div>

                                    </div>
                                </form>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
